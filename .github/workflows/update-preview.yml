name: Publish mobile previews

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add the EXPO_TOKEN secret in the GitHub repository settings."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish iOS preview to EAS
        env:
          CI: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --branch preview --environment preview --platform ios --message "GitHub preview ${GITHUB_SHA}"

      - name: Publish Android preview to EAS
        env:
          CI: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --branch preview --environment preview --platform android --message "GitHub preview ${GITHUB_SHA}"
